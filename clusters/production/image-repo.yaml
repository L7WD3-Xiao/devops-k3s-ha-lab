---
# FluxCD ImageRepository — watches ACR for new shortlink-app image tags
#
# Uses the PUBLIC ACR domain because GitHub Actions runners are outside VPC.
# The Deployment uses the VPC domain for in-cluster pulls (free, fast).
# FluxCD only updates the tag, not the domain — they don't conflict.
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: shortlink-app
  namespace: flux-system
spec:
  image: crpi-vvz6iv4av6k8awep.cn-hangzhou.personal.cr.aliyuncs.com/shortlink123/shortlink-app
  interval: 5m
  secretRef:
    name: acr-credentials
