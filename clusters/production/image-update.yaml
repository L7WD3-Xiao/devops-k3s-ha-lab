---
# FluxCD ImageUpdateAutomation — pushes image tag updates back to Git
#
# When ImagePolicy detects a new tag, this commits the update to
# k8s/app-layer/kustomization.yaml (the newTag line with the marker comment).
# Kustomize Controller then picks up the commit and reconciles.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: shortlink-app
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcd@cluster.local
        name: fluxcd
      messageTemplate: |
        [ci] update shortlink-app image

        Automated by FluxCD ImageUpdateAutomation.
    push:
      branch: main
  # IUA suspended: FluxCD v2.9.2 Setters strategy bug — writes full
  # image reference (domain/ns/repo:tag) as newTag instead of just tag.
  # Image tag updates are now handled directly by GitHub Actions CI.
  suspend: true
  update:
    strategy: Setters
    path: ./k8s/app-layer
