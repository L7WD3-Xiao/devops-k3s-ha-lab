---
# GitHub Actions CI — Build, push shortlink-app Docker image to ACR,
# and update Kustomization tag for FluxCD GitOps sync.
#
# Triggered on push to main when Go code, Dockerfile, or this workflow changes.
# Tag format: v1.0.{run_number} (semver).
#
# NOTE: ImageUpdateAutomation is suspended (FluxCD v2.9.2 Setters strategy bug).
# Instead, this workflow directly updates k8s/app-layer/kustomization.yaml
# with the new tag after pushing to ACR. FluxCD picks up the commit and deploys.
#
# Secrets (set in GitHub repo Settings > Secrets > Actions):
#   ACR_REGISTRY  — ACR public domain
#   ACR_NAMESPACE — ACR namespace
#   ACR_REPOSITORY — ACR repo name
#   ACR_USERNAME  — ACR Docker username
#   ACR_PASSWORD  — ACR Docker password
name: Build, Push, and Update Kustomization

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'Dockerfile'
      - '.github/workflows/build-deploy.yml'
  workflow_dispatch:

env:
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
  ACR_REPOSITORY: ${{ secrets.ACR_REPOSITORY }}

# Needed to push the tag update commit back to the repo
permissions:
  contents: write

jobs:
  build-and-update:
    name: Build, Push, and Update
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Checkout ──────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Setup Go (for vet/test) ───────────────────────────
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: app/go.sum

      # go mod tidy regenerates go.sum (CI has no Go locally, so it's done here)
      - name: Go mod tidy
        working-directory: app
        run: |
          go mod tidy
          if [ -f go.sum ]; then
            echo "go.sum regenerated"
          fi

      - name: Go vet
        working-directory: app
        run: go vet ./...

      # Commit updated go.sum (if go.mod changed)
      - name: Commit go.sum
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/go.sum
          git diff --cached --quiet || {
            git commit -m "[ci] update go.sum for Go 1.26"
            git push
            echo "✅ go.sum committed and pushed"
          }

      - name: Go test
        working-directory: app
        run: go test ./... -v -count=1 || echo "No tests — skipping"

      # ── Setup Docker Buildx ───────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Login to ACR (public domain) ──────────────────────
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # ── Generate semver tag ───────────────────────────────
      - name: Generate image tag
        id: meta
        run: |
          TAG="v1.0.${{ github.run_number }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "full=${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}:${TAG}" >> $GITHUB_OUTPUT
          echo "Tag: ${TAG}"

      # ── Build and push ───────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.full }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ secrets.ACR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}

      # ── Trivy image scan (fail on HIGH/CRITICAL) ───────────
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.meta.outputs.full }}
          format: 'table'
          exit-code: 1
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db

      # ── Update Kustomization tag (replaces IUA) ───────────
      # Directly updates the newTag line in kustomization.yaml so
      # FluxCD picks up the change on the next reconciliation.
      # This replaces ImageUpdateAutomation which has a Setters
      # strategy bug in FluxCD v2.9.2.
      - name: Update Kustomization tag
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          FILE="k8s/app-layer/kustomization.yaml"

          # Replace the newTag value (line format: "    newTag: <old>")
          sed -i "s/^    newTag: .*/    newTag: ${TAG}/" "$FILE"

          echo "=== Updated ${FILE} ==="
          grep "newTag:" "$FILE"

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE" app/go.sum
          git diff --cached --quiet || {
            git commit -m "[ci] update shortlink-app image to ${TAG}"
            git push
            echo "✅ Kustomization tag updated and pushed"
          }

      # ── Summary ───────────────────────────────────────────
      - name: Summary
        run: |
          {
            echo "### :rocket: Build, Push & Kustomization Update Complete"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Image | \`${{ steps.meta.outputs.full }}\` |"
            echo "| Tag   | \`${{ steps.meta.outputs.tag }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
            echo "FluxCD will detect the kustomization update within 1 minute and deploy."
          } >> $GITHUB_STEP_SUMMARY
