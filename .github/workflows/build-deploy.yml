---
# GitHub Actions CI — Build and push shortlink-app Docker image to ACR
#
# Triggered on push to main when Go code or Dockerfile changes.
# Tag format: v1.0.{run_number} (semver, detected by FluxCD ImagePolicy).
#
# Secrets (set in GitHub repo Settings > Secrets > Actions):
#   ACR_REGISTRY  — ACR public domain
#   ACR_NAMESPACE — ACR namespace
#   ACR_REPOSITORY — ACR repo name
#   ACR_USERNAME  — ACR Docker username
#   ACR_PASSWORD  — ACR Docker password
name: Build and Push Shortlink App

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'Dockerfile'
      - '.github/workflows/build-deploy.yml'
  workflow_dispatch:

env:
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
  ACR_REPOSITORY: ${{ secrets.ACR_REPOSITORY }}

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Checkout ──────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Setup Go (for vet/test) ───────────────────────────
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: app/go.sum

      - name: Go vet
        working-directory: app
        run: go vet ./...

      - name: Go test
        working-directory: app
        run: go test ./... -v -count=1 || echo "No tests — skipping"

      # ── Setup Docker Buildx ───────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Login to ACR (public domain) ──────────────────────
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # ── Generate semver tag ───────────────────────────────
      - name: Generate image tag
        id: meta
        run: |
          TAG="v1.0.${{ github.run_number }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "full=${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}:${TAG}" >> $GITHUB_OUTPUT
          echo "Tag: ${TAG}"

      # ── Build and push ───────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.full }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ secrets.ACR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}

      # ── Summary ───────────────────────────────────────────
      - name: Summary
        run: |
          {
            echo "### :rocket: Build & Push Complete"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Image | \`${{ steps.meta.outputs.full }}\` |"
            echo "| Tag   | \`${{ steps.meta.outputs.tag }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
            echo "FluxCD ImageRepository will detect the new tag within 5 minutes."
          } >> $GITHUB_STEP_SUMMARY
