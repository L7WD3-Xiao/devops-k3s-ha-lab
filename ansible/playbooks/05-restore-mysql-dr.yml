---
# 05-restore-mysql-dr.yml
# MySQL 灾难恢复 playbook — 灾难已经发生的场景
#
# 编号说明: 与 05-restore-mysql-drill.yml 共用 05 编号，后缀区分场景:
#   -drill  演练（集群健康，按 phase-7 §6.1 流程验证备份可用性）
#   -dr     真实灾难响应（mysqld 宕机 / datadir 损坏 / 节点重建）
#
# ⚠️ 与 05-restore-mysql-drill.yml 的区别：
#   - 假设 mysqld 可能已宕机 / datadir 可能已损坏（崩溃后无法优雅停止也照常执行）
#   - 假设 datadir 可能不存在（节点重建后从零恢复）
#   - 前置检查更严格：备份工具、OSS 连通性、磁盘空间（演练版假设环境健康）
#   - 启动等待时间更长（大数据量 + InnoDB 崩溃恢复）
#
# 目标: node-03 (MySQL Slave) — Master (node-02) 恢复期间继续服务
# 来源: OSS 中最新备份 (或指定 backup_name)
#
# 流程:
#   1. 前置检查: 备份工具 / OSS 连通性 / OSS 中有备份
#   2. 下载 + 解压 + prepare 备份
#   3. 停止 mysqld（容错: 已宕机则跳过）+ 备份旧 datadir（重命名，不删除）
#   4. 磁盘空间校验 + xtrabackup --copy-back + chown
#   5. 启动 mysqld + 验证数据
#   6. 重建复制 (GTID auto-positioning)
#   7. 汇总
#
# 前提: node-03 已执行过 04-setup-backup-tools.yml（xtrabackup + ossutil 已安装）。
#       如果节点是全新重建的，先跑 04-setup-backup-tools.yml。
#
# 用法:
#   ansible-playbook -i inventory.ini playbooks/05-restore-mysql-dr.yml
#   ansible-playbook -i inventory.ini playbooks/05-restore-mysql-dr.yml \
#     -e backup_name=mysql-full-20260725-020000

# ──────────────────────────────────────────────────────────────
# Play 1: Validate prerequisites
# ──────────────────────────────────────────────────────────────
- name: Validate prerequisites
  hosts: localhost
  gather_facts: false
  connection: local

  tasks:
    - name: Check mysql_root_password is set
      assert:
        that:
          - mysql_root_password is defined
          - mysql_root_password | length > 0
          - mysql_root_password != 'CHANGE_ME'
        fail_msg: "mysql_root_password not set. Configure in group_vars/all.yml."
        success_msg: "mysql_root_password is set"

    - name: Check OSS variables are set
      assert:
        that:
          - oss_access_key_id is defined
          - oss_access_key_id != 'CHANGE_ME'
          - oss_access_key_secret is defined
          - oss_access_key_secret != 'CHANGE_ME'
          - oss_bucket is defined
          - oss_endpoint is defined
        fail_msg: "OSS variables not set. Configure in group_vars/all.yml."
        success_msg: "OSS configuration verified"

    - name: Show backup name to use
      debug:
        msg: "Using backup: {{ backup_name | default('(latest available)') }}"


# ──────────────────────────────────────────────────────────────
# Play 2: DR preflight — tools, OSS connectivity, backups exist
# ──────────────────────────────────────────────────────────────
- name: DR preflight checks
  hosts: node-03
  become: true
  gather_facts: false

  tasks:
    - name: Check xtrabackup is installed
      command: which xtrabackup
      register: xtrabackup_check
      changed_when: false
      failed_when: false

    - name: Fail if xtrabackup missing (node rebuilt?)
      fail:
        msg: >
          xtrabackup not found on node-03. If this node was rebuilt from
          scratch, run 04-setup-backup-tools.yml first, then retry.
      when: xtrabackup_check.rc != 0

    - name: Check ossutil is installed
      command: which ossutil
      register: ossutil_check
      changed_when: false
      failed_when: false

    - name: Fail if ossutil missing (node rebuilt?)
      fail:
        msg: >
          ossutil not found on node-03. If this node was rebuilt from
          scratch, run 04-setup-backup-tools.yml first, then retry.
      when: ossutil_check.rc != 0

    - name: Test OSS connectivity
      command: >
        /usr/local/bin/ossutil ls oss://{{ oss_bucket }}/
        -e {{ oss_endpoint }}
      register: oss_test
      changed_when: false
      failed_when: false

    - name: Fail if OSS unreachable
      fail:
        msg: >
          Cannot reach oss://{{ oss_bucket }}/ — backups are unreadable.
          Check credentials (/root/.ossutilconfig) and VPC endpoint
          {{ oss_endpoint }}.
      when: oss_test.rc != 0

    - name: List available backups
      command: >
        /usr/local/bin/ossutil ls
        oss://{{ oss_bucket }}/{{ oss_mysql_backup_prefix }}/
        -e {{ oss_endpoint }}
      register: oss_ls
      changed_when: false

    - name: Show available backups
      debug:
        var: oss_ls.stdout_lines

    - name: Fail if no backups found
      fail:
        msg: >
          No backups in oss://{{ oss_bucket }}/{{ oss_mysql_backup_prefix }}/ —
          nothing to restore from. Run xtrabackup-backup.sh (or restore from
          another source).
      when: oss_ls.stdout_lines | length == 0


# ──────────────────────────────────────────────────────────────
# Play 3: Download and prepare backup
# ──────────────────────────────────────────────────────────────
- name: Download and prepare xtrabackup
  hosts: node-03
  become: true
  gather_facts: false

  tasks:
    - name: Create restore temp directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /tmp/mysql-restore
        - /tmp/mysql-restore/backup

    - name: Check /tmp free space (need > 2x backup size)
      shell: >
        df -m --output=avail /tmp | tail -1
      register: tmp_free_mb
      changed_when: false

    - name: Show /tmp free space
      debug:
        msg: "/tmp free space: {{ tmp_free_mb.stdout | trim }} MB"
      failed_when: tmp_free_mb.stdout | trim | int < 2048
      # 771M 备份 ×2（压缩包 + 解压）≈ 1.6G，留余量按 2G 检查

    - name: Clean backup directory before extraction
      file:
        path: /tmp/mysql-restore/backup/
        state: absent
      changed_when: false

    - name: Recreate clean backup directory
      file:
        path: /tmp/mysql-restore/backup
        state: directory
        mode: '0755'

    - name: Find latest backup if backup_name not specified
      shell: >
        /usr/local/bin/ossutil ls
        oss://{{ oss_bucket }}/{{ oss_mysql_backup_prefix }}/
        -e {{ oss_endpoint }}
        | grep '.xbstream.gz'
        | sort
        | tail -1
        | awk '{print $NF}'
      register: latest_backup
      changed_when: false
      when: backup_name is not defined

    - name: Set backup_object variable
      set_fact:
        backup_object: "{{ 'oss://' + oss_bucket + '/' + oss_mysql_backup_prefix + '/' + backup_name + '.xbstream.gz' if backup_name is defined else latest_backup.stdout }}"

    - name: Show backup being restored
      debug:
        msg: "Restoring from: {{ backup_object }}"

    - name: Download backup from OSS
      command: >
        /usr/local/bin/ossutil cp "{{ backup_object }}" /tmp/mysql-restore/backup.xbstream.gz
        -f -e {{ oss_endpoint }}
      register: oss_download
      until: oss_download is success
      retries: 3
      delay: 5

    - name: Verify download
      stat:
        path: /tmp/mysql-restore/backup.xbstream.gz
      register: dl_file
      failed_when: not dl_file.stat.exists or dl_file.stat.size == 0

    - name: Show downloaded file size
      debug:
        msg: "Downloaded: {{ dl_file.stat.size | filesizeformat }}"

    - name: Decompress and extract xbstream
      shell:
        cmd: |
          set -o pipefail
          gunzip -c /tmp/mysql-restore/backup.xbstream.gz \
            | xbstream -x -C /tmp/mysql-restore/backup/
      register: extract_result

    - name: Prepare backup with xtrabackup
      command: xtrabackup --prepare --target-dir=/tmp/mysql-restore/backup/
      register: prepare_result
      until: prepare_result is success
      retries: 2
      delay: 5

    - name: Verify prepare completed OK
      assert:
        that:
          - "'completed OK!' in prepare_result.stdout or 'completed OK!' in prepare_result.stderr"
        fail_msg: >
          xtrabackup --prepare did not complete successfully.
          stdout last 5 lines: {{ prepare_result.stdout_lines[-5:] | default(['(empty)']) | join('; ') }}
          stderr last 5 lines: {{ prepare_result.stderr_lines[-5:] | default(['(empty)']) | join('; ') }}
        success_msg: "xtrabackup --prepare completed OK"


# ──────────────────────────────────────────────────────────────
# Play 4: Stop MySQL (tolerant) and quarantine old datadir
# ──────────────────────────────────────────────────────────────
- name: Stop MySQL and backup old datadir
  hosts: node-03
  become: true
  gather_facts: true
  serial: 1

  tasks:
    - name: Check if mysqld is running
      command: systemctl is-active mysqld
      register: mysqld_state
      changed_when: false
      failed_when: false

    - name: Stop mysqld (tolerate already-dead service)
      systemd:
        name: mysqld
        state: stopped
      register: mysql_stop
      failed_when: false
      when: mysqld_state.stdout | trim == 'active'

    - name: Wait for MySQL port to close
      wait_for:
        port: 3306
        state: stopped
        timeout: 30
      when: mysqld_state.stdout | trim == 'active'

    - name: Backup old datadir (rename, don't delete)
      command: >
        mv /var/lib/mysql /var/lib/mysql.pre-restore.{{ ansible_date_time.epoch }}
      args:
        removes: /var/lib/mysql
      register: datadir_backup

    - name: Create fresh datadir
      file:
        path: /var/lib/mysql
        state: directory
        mode: '0755'
        owner: mysql
        group: mysql

    - name: Note rollback path
      debug:
        msg: >
          Old data (if any) moved to: {{ datadir_backup.stdout | default('/var/lib/mysql.pre-restore.*') }}.
          To rollback: systemctl stop mysqld; rm -rf /var/lib/mysql;
          mv <backup_dir> /var/lib/mysql; systemctl start mysqld


# ──────────────────────────────────────────────────────────────
# Play 5: Restore backup with xtrabackup --copy-back
# ──────────────────────────────────────────────────────────────
- name: Restore MySQL data from prepared backup
  hosts: node-03
  become: true
  gather_facts: false

  tasks:
    - name: Check /var free space vs prepared backup size
      shell: |
        backup_mb=$(du -sm /tmp/mysql-restore/backup/ | awk '{print $1}')
        free_mb=$(df -m --output=avail /var/lib | tail -1)
        echo "backup=${backup_mb}MB free=${free_mb}MB"
      register: space_check
      changed_when: false

    - name: Fail if /var space is insufficient
      fail:
        msg: >
          Not enough space on /var/lib: {{ space_check.stdout | trim }}.
          Need free > backup size ×1.5 for copy-back. Clean up old
          /var/lib/mysql.pre-restore.* or /tmp/mysql-restore/ first.
      when: >
        (space_check.stdout | regex_search('free=(\d+)MB', '\1') | first | int)
        <= (space_check.stdout | regex_search('backup=(\d+)MB', '\1') | first | int) * 1.5

    - name: Run xtrabackup --copy-back
      command: xtrabackup --copy-back --target-dir=/tmp/mysql-restore/backup/ --datadir=/var/lib/mysql
      register: copy_back

    - name: Verify copy-back completed OK
      fail:
        msg: >
          xtrabackup --copy-back failed.
          stdout: {{ copy_back.stdout_lines[-3:] | default(['(empty)']) | join('; ') }}
          stderr: {{ copy_back.stderr_lines[-3:] | default(['(empty)']) | join('; ') }}
      when: "'completed OK!' not in (copy_back.stdout | default('') + copy_back.stderr | default(''))"

    - name: Set MySQL datadir ownership
      file:
        path: /var/lib/mysql
        state: directory
        recurse: true
        owner: mysql
        group: mysql


# ──────────────────────────────────────────────────────────────
# Play 6: Start MySQL and verify data
# ──────────────────────────────────────────────────────────────
- name: Start MySQL and verify data integrity
  hosts: node-03
  become: true
  gather_facts: false

  tasks:
    - name: Start mysqld
      systemd:
        name: mysqld
        state: started
        enabled: true

    - name: Wait for MySQL to be ready (long timeout — InnoDB recovery)
      wait_for:
        port: 3306
        state: started
        timeout: 180

    - name: Verify MySQL root login
      command: >
        mysql -u root -p'{{ mysql_root_password }}' -e "SELECT VERSION();"
      register: mysql_ver
      changed_when: false
      failed_when: false

    - name: Show MySQL version
      debug:
        msg: "MySQL version: {{ mysql_ver.stdout_lines | select('search', 'VERSION') | first | default('(unknown)') }}"

    - name: List databases
      command: >
        mysql -u root -p'{{ mysql_root_password }}' -e "SHOW DATABASES;"
      register: mysql_databases
      changed_when: false
      failed_when: false

    - name: Show databases
      debug:
        var: mysql_databases.stdout_lines

    - name: Check shortlink data
      command: >
        mysql -u root -p'{{ mysql_root_password }}'
        -e "SELECT COUNT(*) AS total_urls FROM shortlink.urls;"
      register: mysql_urls
      changed_when: false
      failed_when: false

    - name: Show URL count
      debug:
        msg: "{{ mysql_urls.stdout_lines | default('(table not found)') }}"


# ──────────────────────────────────────────────────────────────
# Play 7: Rebuild replication (GTID auto-positioning)
# ──────────────────────────────────────────────────────────────
- name: Rebuild MySQL replication
  hosts: node-03
  become: true
  gather_facts: false

  tasks:
    - name: Check current replica status
      command: >
        mysql -u root -p'{{ mysql_root_password }}'
        -e "SHOW REPLICA STATUS\\G"
      register: replica_status
      changed_when: false
      failed_when: false

    - name: Show replica status
      debug:
        var: replica_status.stdout_lines

    - name: Stop replica if running
      command: >
        mysql -u root -p'{{ mysql_root_password }}' -e "STOP REPLICA;"
      changed_when: false
      failed_when: false
      when: replica_status.stdout is defined and replica_status.stdout | length > 0

    - name: Reset replica metadata (clean slate from restored backup)
      command: >
        mysql -u root -p'{{ mysql_root_password }}' -e "RESET REPLICA ALL;"
      register: reset_replica
      changed_when: reset_replica.rc == 0
      failed_when: false

    - name: Configure replication with GTID auto-positioning
      command: >
        mysql -u root -p'{{ mysql_root_password }}' -e "
          CHANGE REPLICATION SOURCE TO
            SOURCE_HOST='{{ mysql_master_ip }}',
            SOURCE_USER='{{ mysql_repl_user }}',
            SOURCE_PASSWORD='{{ mysql_repl_password }}',
            SOURCE_AUTO_POSITION=1,
            GET_SOURCE_PUBLIC_KEY=1;
        "
      register: change_replica
      changed_when: change_replica.rc == 0

    - name: Start replica
      command: >
        mysql -u root -p'{{ mysql_root_password }}' -e "START REPLICA;"
      register: start_replica
      changed_when: start_replica.rc == 0

    - name: Wait for replication to stabilize
      pause:
        seconds: 5

    - name: Verify replication status
      command: >
        mysql -u root -p'{{ mysql_root_password }}' -e "SHOW REPLICA STATUS\\G"
      register: replica_verify
      changed_when: false
      failed_when: false

    - name: Check IO and SQL threads
      shell: >
        mysql -u root -p'{{ mysql_root_password }}' -e "SHOW REPLICA STATUS\\G" 2>/dev/null
        | grep -E "Replica_(IO|SQL)_Running"
      register: thread_status
      changed_when: false

    - name: Show replication thread status
      debug:
        var: thread_status.stdout_lines

    - name: Fail if replication not running
      fail:
        msg: "Replication not running! Check: Replica_IO_Running and Replica_SQL_Running should both be Yes."
      when: >
        thread_status.stdout is defined
        and ('Replica_IO_Running: Yes' not in thread_status.stdout
        or 'Replica_SQL_Running: Yes' not in thread_status.stdout)


# ──────────────────────────────────────────────────────────────
# Play 8: Summary
# ──────────────────────────────────────────────────────────────
- name: Display DR restore summary
  hosts: node-03
  become: true
  gather_facts: false

  tasks:
    - name: Show completion message
      debug:
        msg:
          - "═══════════════════════════════════════════════════════"
          - " MySQL DR restore completed on node-03"
          - "═══════════════════════════════════════════════════════"
          - ""
          - " Restored from:     {{ backup_object | default('(see above)') }}"
          - " MySQL version:     {{ mysql_ver.stdout_lines | select('search', 'VERSION') | first | default('(verify)') }}"
          - " Shortlink URLs:    {{ mysql_urls.stdout_lines | select('search', 'total_urls') | first | default('(verify)') }}"
          - " Replication:       {{ 'OK' if thread_status.stdout is defined and 'Replica_IO_Running: Yes' in thread_status.stdout and 'Replica_SQL_Running: Yes' in thread_status.stdout else 'CHECK' }}"
          - ""
          - " Old datadir:       /var/lib/mysql.pre-restore.* (keep until verified)"
          - " Temp files:        /tmp/mysql-restore/ (clean after verification)"
          - ""
          - " Next steps:"
          - "   1. Verify app: curl http://<集群公网入口IP>/health"
          - "   2. Watch replication catch up: SHOW REPLICA STATUS\\G"
          - "   3. If Master (node-02) was also lost, promote node-03:"
          - "      ProxySQL backend reconfiguration required"
          - ""
          - "═══════════════════════════════════════════════════════"
