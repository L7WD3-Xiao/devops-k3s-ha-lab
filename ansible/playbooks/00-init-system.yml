---
# 00-init-system.yml
# Base system initialization for all K3s cluster nodes (Alibaba Cloud ECS)
# Most setup done by cloud-init; this playbook verifies + supplements.
#
# Run: ansible-playbook -i inventory.ini playbooks/00-init-system.yml

- name: Initialize all K3s cluster nodes
  hosts: k3s_cluster
  become: true
  gather_facts: true

  tasks:
    - name: Install base packages (dnf)
      command: "dnf install -y {{ base_packages | join(' ') }}"
      changed_when: false  # idempotent: dnf skips already-installed packages

    - name: Disable swap immediately
      shell: swapoff -a
      when: ansible_facts.swaptotal_mb > 0
      changed_when: false

    - name: Remove swap from fstab
      lineinfile:
        path: /etc/fstab
        regexp: '\sswap\s'
        state: absent

    - name: Load br_netfilter module
      modprobe:
        name: br_netfilter
        state: present
      ignore_errors: true

    - name: Configure sysctl for K3s
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_set: true
        state: present
        reload: true
      loop: "{{ sysctl_k3s_config }}"
      ignore_errors: true  # br_netfilter may not be loaded yet

    - name: Configure /etc/hosts
      copy:
        dest: /etc/hosts
        content: |
          127.0.0.1   localhost
          {% for host in cluster_hosts %}
          {{ host.ip }}  {{ host.hostname }}
          {% endfor %}

    - name: Set timezone
      timezone:
        name: "{{ timezone }}"

    - name: Ensure chronyd is running and enabled
      service:
        name: chronyd
        state: started
        enabled: true

    - name: Ensure firewalld is disabled (K3s manages its own firewall)
      service:
        name: firewalld
        state: stopped
        enabled: false
      ignore_errors: true

    - name: Verify ops user exists
      user:
        name: "{{ ops_user }}"
        shell: /bin/bash
        groups: wheel
        append: true
        create_home: true

    - name: Ensure ops passwordless sudo
      copy:
        dest: "/etc/sudoers.d/{{ ops_user }}"
        content: "{{ ops_user }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: '0440'
        validate: 'visudo -cf %s'

  post_tasks:
    - name: Verify swap is disabled
      command: free -h
      register: free_output
      changed_when: false

    - name: Show memory info
      debug:
        var: free_output.stdout_lines

    - name: Verify inter-node connectivity
      command: "ping -c 1 -W 2 {{ item.ip }}"
      loop: "{{ cluster_hosts }}"
      when: item.hostname != inventory_hostname
      changed_when: false

    - name: Show node network info
      command: ip -4 addr show eth0
      register: ip_output
      changed_when: false

    - name: Display eth0 info
      debug:
        var: ip_output.stdout_lines
