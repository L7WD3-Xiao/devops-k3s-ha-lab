---
# 01-deploy-k3s.yml
# Deploy K3s 3-Server HA cluster with embedded etcd
#
# Architecture:
#   node-01  ── K3s server (cluster-init, first etcd member)
#   node-02  ── K3s server (join, etcd member)
#   node-03  ── K3s server (join, etcd member)
#
# All 3 nodes are control-plane + etcd + worker.
#
# Network:
#   Only node-01 has public IP (EIP). node-02/03 have no internet access.
#   K3s binary and install script are distributed from node-01 via
#   Ansible copy module (controller = node-01).
#
# Usage:
#   ansible-playbook -i inventory.ini playbooks/01-deploy-k3s.yml
#
# Idempotent: re-running skips nodes where K3s is already installed.

# ──────────────────────────────────────────────────────────────
# Play 1: Pre-flight checks on all nodes
# ──────────────────────────────────────────────────────────────
- name: Pre-flight checks for K3s HA deployment
  hosts: k3s_cluster
  become: true
  gather_facts: true

  tasks:
    - name: Verify swap is disabled
      assert:
        that:
          - ansible_facts.swaptotal_mb == 0
        fail_msg: >
          Swap is still active on {{ inventory_hostname }}.
          Run playbook 00-init-system.yml first.
        success_msg: "Swap disabled on {{ inventory_hostname }}"

    - name: Verify systemd is active
      command: systemctl is-system-running
      register: systemd_state
      changed_when: false
      failed_when: systemd_state.stdout not in ['running', 'degraded']

    - name: Show systemd state
      debug:
        msg: "{{ inventory_hostname }}: systemd is {{ systemd_state.stdout }}"

    - name: Verify ip_forward is enabled
      command: sysctl -n net.ipv4.ip_forward
      register: ip_forward
      changed_when: false
      failed_when: ip_forward.stdout != '1'

    - name: Verify inter-node connectivity
      command: "ping -c 1 -W 2 {{ item.ip }}"
      loop: "{{ cluster_hosts }}"
      when: item.hostname != inventory_hostname
      changed_when: false

    - name: Check if K3s is already installed (service file = fully installed)
      stat:
        path: /etc/systemd/system/k3s.service
      register: k3s_installed

    - name: Show K3s installation status
      debug:
        msg: "{{ inventory_hostname }}: K3s {{ 'already installed' if k3s_installed.stat.exists else 'not installed' }}"


# ──────────────────────────────────────────────────────────────
# Play 2: Deploy first K3s server (node-01, cluster-init)
# ──────────────────────────────────────────────────────────────
- name: Deploy first K3s server (node-01)
  hosts: node-01
  become: true
  gather_facts: false

  tasks:
    - name: Create K3s config directory
      file:
        path: "{{ k3s_config_dir }}"
        state: directory
        mode: '0755'

    - name: Deploy K3s config file
      template:
        src: k3s-config.yaml.j2
        dest: "{{ k3s_config_dir }}/config.yaml"
        mode: '0600'

    - name: Download K3s install script (cache for node-02/03)
      get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: '0755'

    - name: Install K3s server (cluster-init)
      when: not hostvars[inventory_hostname]['k3s_installed'].stat.exists
      block:
        # K3s binary pre-downloaded via gh-proxy (GitHub direct is too slow from China)
        - name: Verify K3s binary exists
          stat:
            path: /usr/local/bin/k3s
          register: k3s_binary_check

        - name: Fail if K3s binary missing
          assert:
            that: k3s_binary_check.stat.exists
            fail_msg: "K3s binary not found at /usr/local/bin/k3s. Download it first via gh-proxy."

        - name: Run K3s install script (skip download, binary pre-placed)
          shell: "INSTALL_K3S_SKIP_DOWNLOAD=true /tmp/k3s-install.sh"
          environment: "{{ {'INSTALL_K3S_VERSION': k3s_version} if k3s_version else {} }}"
          timeout: 300

        - name: Wait for K3s API port to be listening
          wait_for:
            port: "{{ k3s_api_port }}"
            host: "{{ node_ips[inventory_hostname] }}"
            timeout: 120

        - name: Wait for K3s to report node ready
          command: /usr/local/bin/k3s kubectl get node {{ inventory_hostname }}
          register: node_ready
          until: "' Ready' in node_ready.stdout"
          retries: 12
          delay: 5
          changed_when: false

    - name: Read K3s cluster token
      command: cat /var/lib/rancher/k3s/server/token
      register: k3s_token_raw
      changed_when: false

    - name: Set K3s token as fact (for joining servers)
      set_fact:
        k3s_cluster_token: "{{ k3s_token_raw.stdout }}"
        cacheable: true

    - name: Show cluster token (first 12 chars for verification)
      debug:
        msg: "Cluster token: {{ k3s_cluster_token[:12] }}..."

    - name: Configure ops user kubectl access
      block:
        - name: Create .kube directory for ops
          file:
            path: /home/ops/.kube
            state: directory
            owner: ops
            group: ops
            mode: '0755'

        - name: Copy kubeconfig for ops user
          copy:
            src: /etc/rancher/k3s/k3s.yaml
            dest: /home/ops/.kube/config
            owner: ops
            group: ops
            mode: '0600'
            remote_src: true

        - name: Fix server URL in ops kubeconfig (use EIP for external access)
          replace:
            path: /home/ops/.kube/config
            regexp: '127\.0\.0\.1'
            replace: "{{ k3s_external_ip }}"

        - name: Install kubectl symlink
          file:
            src: /usr/local/bin/k3s
            dest: /usr/local/bin/kubectl
            state: link
            force: false

    - name: Show node-01 K3s status
      command: /usr/local/bin/k3s kubectl get nodes -o wide
      register: nodes_output
      changed_when: false

    - name: Display cluster nodes
      debug:
        var: nodes_output.stdout_lines


# ──────────────────────────────────────────────────────────────
# Play 3: Deploy joining K3s servers (node-02, node-03)
# Serial=1: join one at a time to avoid etcd election conflicts
# ──────────────────────────────────────────────────────────────
- name: Deploy joining K3s servers (node-02, node-03)
  hosts: node-02,node-03
  become: true
  gather_facts: false
  serial: 1

  tasks:
    - name: Show deployment info
      debug:
        msg: "Deploying {{ inventory_hostname }} as K3s server (joining HA cluster)"

    - name: Create K3s config directory
      file:
        path: "{{ k3s_config_dir }}"
        state: directory
        mode: '0755'

    - name: Deploy K3s config file (join config with server URL)
      template:
        src: k3s-config.yaml.j2
        dest: "{{ k3s_config_dir }}/config.yaml"
        mode: '0600'

    - name: Install K3s server (join HA cluster)
      when: not hostvars[inventory_hostname]['k3s_installed'].stat.exists
      block:
        - name: Copy K3s binary from node-01 (node-02/03 have no public IP)
          copy:
            src: /usr/local/bin/k3s
            dest: /usr/local/bin/k3s
            mode: '0755'
            owner: root
            group: root

        - name: Copy K3s install script from node-01
          copy:
            src: /tmp/k3s-install.sh
            dest: /tmp/k3s-install.sh
            mode: '0755'

        - name: Run K3s install script (server join, skip download)
          shell: >-
            K3S_TOKEN={{ hostvars['node-01']['k3s_cluster_token'] }}
            INSTALL_K3S_SKIP_DOWNLOAD=true
            /tmp/k3s-install.sh
          environment: "{{ {'INSTALL_K3S_VERSION': k3s_version} if k3s_version else {} }}"
          timeout: 300

        - name: Wait for node to appear in cluster (checked from node-01)
          command: /usr/local/bin/k3s kubectl get node {{ inventory_hostname }}
          register: join_result
          until: "' Ready' in join_result.stdout"
          retries: 20
          delay: 5
          changed_when: false
          delegate_to: node-01

    - name: Show node join status
      command: /usr/local/bin/k3s kubectl get node {{ inventory_hostname }} -o wide
      register: node_status
      changed_when: false
      delegate_to: node-01

    - name: Display node status
      debug:
        var: node_status.stdout_lines


# ──────────────────────────────────────────────────────────────
# Play 4: Verify cluster health
# ──────────────────────────────────────────────────────────────
- name: Verify K3s HA cluster health
  hosts: node-01
  become: true
  gather_facts: false

  tasks:
    - name: Get all cluster nodes
      command: /usr/local/bin/k3s kubectl get nodes -o wide
      register: nodes_final
      changed_when: false

    - name: Display cluster nodes
      debug:
        var: nodes_final.stdout_lines

    - name: Assert all 3 nodes are Ready
      assert:
        that:
          - "'node-01' in nodes_final.stdout"
          - "'node-02' in nodes_final.stdout"
          - "'node-03' in nodes_final.stdout"
          - nodes_final.stdout.count('Ready') >= 3
        fail_msg: "Not all nodes are Ready!"
        success_msg: "All 3 nodes are Ready"

    - name: Get all pods across namespaces
      command: /usr/local/bin/k3s kubectl get pods -A
      register: pods_final
      changed_when: false

    - name: Display all pods
      debug:
        var: pods_final.stdout_lines

    - name: Get cluster info
      command: /usr/local/bin/k3s kubectl cluster-info
      register: cluster_info
      changed_when: false

    - name: Display cluster info
      debug:
        var: cluster_info.stdout_lines

    - name: Check etcd endpoint health (HA datastore)
      shell: /usr/local/bin/k3s kubectl get --raw='/readyz?verbose' | head -20
      register: etcd_health
      changed_when: false
      ignore_errors: true

    - name: Display etcd health
      debug:
        var: etcd_health.stdout_lines

    - name: Display completion message
      debug:
        msg:
          - "═══════════════════════════════════════════════════════"
          - " K3s 3-Server HA Cluster deployed successfully!"
          - "═══════════════════════════════════════════════════════"
          - ""
          - " Architecture: 3 servers (node-01/02/03) + embedded etcd"
          - " Datastore: embedded etcd (HA)"
          - ""
          - " Kubeconfig on node-01: /etc/rancher/k3s/k3s.yaml"
          - " Kubeconfig for ops:     /home/ops/.kube/config"
          - " API server:             https://{{ k3s_external_ip }}:6443"
          - ""
          - " To access from your machine:"
          - "   scp node-01:/home/ops/.kube/config ~/.kube/config"
          - "   kubectl get nodes"
          - ""
          - "═══════════════════════════════════════════════════════"
