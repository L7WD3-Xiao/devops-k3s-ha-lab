---
# Global variables for all K3s cluster nodes

# Node IP mapping
node_ips:
  node-01: 192.168.50.11
  node-02: 192.168.50.12
  node-03: 192.168.50.13

# /etc/hosts entries
cluster_hosts:
  - { ip: "192.168.50.11", hostname: "node-01" }
  - { ip: "192.168.50.12", hostname: "node-02" }
  - { ip: "192.168.50.13", hostname: "node-03" }

# Base packages
base_packages:
  - curl
  - wget
  - vim
  - git
  - net-tools
  - iproute2
  - openssh-server
  - chrony
  - python3
  - python3-pip
  - gnupg
  - software-properties-common
  - ca-certificates
  - python3-passlib    # required by Ansible password_hash filter

# Sysctl parameters for K3s
sysctl_k3s_config:
  - { key: "net.ipv4.ip_forward", value: 1 }
  - { key: "net.bridge.bridge-nf-call-iptables", value: 1 }
  - { key: "net.bridge.bridge-nf-call-ip6tables", value: 1 }

# Timezone
timezone: Asia/Shanghai

# Ops user
ops_user: ops
ops_password: "{{ 'ops123' | password_hash('sha512') }}"

# ── K3s Configuration ─────────────────────────────────────────
# Version: empty = latest stable. Pin for production reproducibility
# (e.g., "v1.30.5+k3s1")
k3s_version: ""

# First server node (cluster-init)
k3s_first_server: node-01
k3s_first_server_ip: "{{ node_ips['node-01'] }}"

# K3s API server port
k3s_api_port: 6443

# Flannel network interface (WSL2: all nodes share eth0)
k3s_flannel_iface: eth0

# K3s directories
k3s_config_dir: /etc/rancher/k3s
k3s_data_dir: /var/lib/rancher/k3s
