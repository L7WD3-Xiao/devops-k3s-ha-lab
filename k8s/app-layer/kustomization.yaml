# Kustomization for application layer — shortlink service
# Managed by FluxCD. Do not edit manually on the cluster.
#
# Secret (secret.yaml) is NOT included — it's gitignored and managed manually.
#
# Image tag is updated by GitHub Actions CI (not IUA — Setters strategy is broken).
# CI workflow updates this file directly after pushing the new image to ACR.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-layer
resources:
  - namespace.yaml
  - configmap.yaml
  - shortlink.yaml
  - ingress.yaml
  - hpa.yaml
images:
  - name: crpi-vvz6iv4av6k8awep-vpc.cn-hangzhou.personal.cr.aliyuncs.com/shortlink123/shortlink-app
    newTag: v1.0.6
