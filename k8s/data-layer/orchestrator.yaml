---
# Orchestrator — MySQL topology management & automatic failover
# Web UI: http://orchestrator:3000
# Discovers MySQL master-slave topology and performs auto-recovery on failure
#
# Backend: uses existing MySQL master (192.168.1.230) for metadata storage.
# Trade-off: if master fails, Orchestrator loses backend access temporarily,
# but can still promote the slave. Backend data is GTID-replicated to slave.
#
# Passwords are injected via K8s Secret (mysql-credentials) + init container.
# ConfigMap only contains __PLACEHOLDER__ tokens.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orchestrator-config
  namespace: data-layer
data:
  orchestrator.conf.json.template: |
    {
      "Debug": false,
      "Listen": ":3000",

      "MySQLTopologyUser": "orchestrator",
      "MySQLTopologyPassword": "__ORCHESTRATOR_PASSWORD__",
      "MySQLTopologyHost": "192.168.1.230",
      "MySQLTopologyPort": 3306,

      "MySQLOrchestratorHost": "192.168.1.230",
      "MySQLOrchestratorPort": 3306,
      "MySQLOrchestratorDatabase": "orchestrator",
      "MySQLOrchestratorUser": "orchestrator",
      "MySQLOrchestratorPassword": "__ORCHESTRATOR_PASSWORD__",

      "DiscoverByShowSlaveHosts": false,
      "InstancePollSeconds": 5,
      "FailureDetectionPeriodBlockMinutes": 1,
      "RecoveryPeriodBlockSeconds": 30,

      "MasterFailoverDetachReplicaMasterHost": true,
      "MasterFailoverLostInstancesDowntimeMinutes": 0,
      "DetachLostReplicasAfterMasterFailover": true,
      "ApplyMySQLPromotionAfterMasterFailover": true,

      "PreventCrossDataCenterMasterFailover": false,
      "PreventCrossRegionMasterFailover": false,

      "DetectClusterAliasQuery": "SELECT SUBSTRING_INDEX(@@hostname, '.', 1)",
      "DetectInstanceAliasQuery": "SELECT SUBSTRING_INDEX(@@hostname, '.', 1)",

      "HostnameResolveMethod": "none",
      "SkipImplicitResolve": true,

      "PowerAuthUsers": ["root", "orchestrator"],
      "AccessLevel": "write",

      "Autorecovery": true,
      "FailMasterPromotionIfSQLThreadNotRunning": true,
      "DelayMasterPromotionIfSQLThreadNotUpToDate": true,

      "ProxySQL": {
        "Enabled": true,
        "ProxySQLHost": "proxysql",
        "ProxySQLPort": 6032,
        "ProxySQLUser": "admin",
        "ProxySQLPassword": "__PROXYSQL_ADMIN_PASSWORD__",
        "WriterHostgroupID": 1,
        "ReaderHostgroupID": 2
      },

      "MySQLTransport": "tcp",
      "AuditPurgeDurationHours": 168,
      "MaintenancePurgeDurationHours": 168
    }
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: data-layer
  labels:
    app.kubernetes.io/part-of: mysql-ha
spec:
  selector:
    app: orchestrator
  ports:
    - port: 3000
      name: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: data-layer
  labels:
    app.kubernetes.io/part-of: mysql-ha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      serviceAccountName: orchestrator
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      nodeSelector:
        kubernetes.io/hostname: node-01
      initContainers:
        - name: render-config
          image: openarkcode/orchestrator:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          command:
            - sh
            - -c
            - |
              sed \
                -e "s|__ORCHESTRATOR_PASSWORD__|${ORCHESTRATOR_PASSWORD}|g" \
                -e "s|__PROXYSQL_ADMIN_PASSWORD__|${PROXYSQL_ADMIN_PASSWORD}|g" \
                /template/orchestrator.conf.json.template > /rendered/orchestrator.conf.json
              echo "[init] orchestrator.conf.json rendered successfully"
          env:
            - name: ORCHESTRATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: orchestrator-password
            - name: PROXYSQL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: proxysql-admin-password
          volumeMounts:
            - name: config-template
              mountPath: /template
            - name: rendered-config
              mountPath: /rendered
      containers:
        - name: orchestrator
          image: openarkcode/orchestrator:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          command: ["/usr/local/orchestrator/orchestrator"]
          args: ["-c", "/etc/orchestrator.conf.json", "http"]
          ports:
            - containerPort: 3000
              name: web
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: rendered-config
              mountPath: /etc/orchestrator.conf.json
              subPath: orchestrator.conf.json
      volumes:
        - name: config-template
          configMap:
            name: orchestrator-config
        - name: rendered-config
          emptyDir: {}
