---
# Stage 1: selfSigned ClusterIssuer → 自签根 CA
# 根 CA 有效期 10 年，作为私有 PKI 信任锚点
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
  namespace: cert-manager
  labels:
    app.kubernetes.io/part-of: shortlink-cluster
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: k3s-root-ca
  namespace: cert-manager
  labels:
    app.kubernetes.io/part-of: shortlink-cluster
spec:
  isCA: true
  commonName: k3s-internal-ca
  duration: 87600h              # 10 年
  secretName: k3s-root-ca-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
